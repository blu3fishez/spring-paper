dependencies {
    api project(':spring-paper-core')
    api platform("org.springframework.security:spring-security-bom:${rootProject.springSecurityVersion}")
    api 'org.springframework.security:spring-security-config'
    api 'org.springframework.security:spring-security-core'
    compileOnly "io.papermc.paper:paper-api:${rootProject.paperVersion}"
    testImplementation "io.papermc.paper:paper-api:${rootProject.paperVersion}"
    testImplementation 'org.mockito:mockito-core:5.23.0'
}
