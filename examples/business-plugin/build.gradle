plugins { id 'org.blu3fishez.spring-paper' }
group = 'org.blu3fishez.springpaper.example'
version = '0.1.0-SNAPSHOT'
dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    implementation 'org.blu3fishez.springpaper:spring-paper-data-jdbc:0.1.0-SNAPSHOT'
    runtimeOnly 'com.h2database:h2:2.4.240'
}
dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.papermc.paper:paper-api:26.3.build.244-stable'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
