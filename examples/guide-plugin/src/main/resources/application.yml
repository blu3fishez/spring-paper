spring:
  paper:
    minecraft:
      version: '26.3'
      api-version: '26.3'
      api-coordinate: '26.3.build.244-stable'
      build: 244
      java-version: 25
    development:
      directory: run
      accept-eula: false
      jvm-args: ['-Xms512M', '-Xmx1G']
      server-properties:
        server-ip: '127.0.0.1'
        server-port: 25585
        online-mode: true
        enable-rcon: false
        view-distance: 3
        simulation-distance: 3
        spawn-protection: 0
        max-players: 2
    jpa:
      enabled: true
      entities: org.blu3fishez.springpaper.example.domain
      repositories: org.blu3fishez.springpaper.example.repository
      datasource:
        url: 'jdbc:h2:./data/example'
        username: sa
        password: ''
        maximum-pool-size: 2
      properties:
        hibernate.hbm2ddl.auto: create-drop
    cache:
      enabled: true
      names: [notes]
      spec: 'maximumSize=100,expireAfterWrite=1m'
    security:
      enabled: true
